name: Update README screenshots

# Run manually from the Actions tab after UI changes.
# Builds the demo, drives it with Playwright and commits docs/cover.jpg.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.48
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
        env:
          VITE_DEMO: "true"
      - run: node scripts/readme-screenshots.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cover.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update README screenshots"
            git push
          fi
